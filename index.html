<script>
'use strict';
/* ========== 工具函数 ========== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const numOrNull=v=>{if(v===''||v==null)return null;const n=Number(v);return isFinite(n)?n:null};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2200)}
const pref={get(k,d){try{const v=localStorage.getItem('imc.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('imc.'+k,JSON.stringify(v))}catch(e){}}};

/* ========== IndexedDB ========== */
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('image-model-compare',1);
 r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('sets',{keyPath:'id'});const es=d.createObjectStore('entries',{keyPath:'id'});es.createIndex('setId','setId');d.createObjectStore('models',{keyPath:'name'});d.createObjectStore('meta',{keyPath:'key'})};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const reqP=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const store=(s,m='readonly')=>db.transaction(s,m).objectStore(s);
const idb={all:s=>reqP(store(s).getAll()),get:(s,k)=>reqP(store(s).get(k)),put:(s,v)=>reqP(store(s,'readwrite').put(v)),del:(s,k)=>reqP(store(s,'readwrite').delete(k)),clear:s=>reqP(store(s,'readwrite').clear())};

/* ========== 状态 ========== */
const S={sets:[],entries:[],models:[],cur:pref.get('cur',null),view:pref.get('view','grid'),sort:pref.get('sort','order'),thumb:pref.get('thumb',260),rate:pref.get('rate',7.2),q:'',picked:new Set()};
const urls=new Map();
function urlOf(e){if(!e.blob)return '';if(!urls.has(e.id))urls.set(e.id,URL.createObjectURL(e.blob));return urls.get(e.id)}
function dropUrl(id){if(urls.has(id)){URL.revokeObjectURL(urls.get(id));urls.delete(id)}}
const cur=()=>S.sets.find(s=>s.id===S.cur);
const entriesOf=id=>S.entries.filter(e=>e.setId===id);
const modelByName=n=>S.models.find(m=>m.name.toLowerCase()===String(n||'').trim().toLowerCase());

/* ========== 格式化 ========== */
const CURRENCIES=['$','¥','积分','其他'];
/* 预设模型名（模型名称下拉框中优先显示；上传时也会按文件名识别） */
const PRESET_MODELS=['gpt 2.5 sunburst','gpt 2.5 flare','nano banana 2.1','grok 2','flux 3','krea 2'];
const normName=s=>String(s||'').toLowerCase().replace(/[\s_\-.·]+/g,'');
function trimNum(n){return Number(n).toFixed(4).replace(/\.?0+$/,'')}
const fmtCNY=v=>'¥'+(v>0&&v<0.01?v.toFixed(4).replace(/0+$/,''):v.toFixed(2));
/* 成本显示（HTML）：美元自动附带人民币折算 */
function fmtCost(e,cny=true){if(e.cost==null)return '—';const c=e.currency||'$';let s=(c==='¥'||c==='$')?c+trimNum(e.cost):trimNum(e.cost)+' '+esc(c);if(cny&&c==='$')s+=` <span class="cny">≈ ${fmtCNY(costCNY(e))}</span>`;return s}
const fmtTime=t=>t==null?'—':trimNum(Math.round(t*100)/100)+'s';
const fmtRes=e=>e.width&&e.height?`${e.width}×${e.height}`:'—';
const mp=e=>e.width&&e.height?(e.width*e.height/1e6).toFixed(2)+' MP':'';
function aspectOf(w,h){if(!w||!h)return '';const r=w/h;const C=[[1,1],[4,3],[3,4],[16,9],[9,16],[3,2],[2,3],[21,9],[9,21],[5,4],[4,5],[2,1],[1,2],[7,4],[4,7],[12,5],[5,12]];
 for(const[a,b]of C)if(Math.abs(r-a/b)<0.012)return a+':'+b;const gcd=(x,y)=>y?gcd(y,x%y):x;const g=gcd(Math.round(w),Math.round(h));if(w/g<=32&&h/g<=32)return w/g+':'+h/g;return r>=1?r.toFixed(2)+':1':'1:'+(1/r).toFixed(2)}
const aspect=e=>e.aspect||aspectOf(e.width,e.height)||'—';
/* 10 分制评分条 */
function stars(n,cls=''){n=Math.round(n||0);let s='';for(let i=1;i<=10;i++)s+=`<i class="${i<=n?'on':''}"></i>`;return `<span class="score ${cls}" title="${n?n+' / 10':'未评分'}"><span class="segs">${s}</span><b>${n||'–'}</b><small>/10</small></span>`}
function parseParams(t){const lines=String(t||'').split(/\n|；|;/).map(s=>s.trim()).filter(Boolean);if(!lines.length)return null;const kv=[];
 for(const l of lines){const m=l.match(/^([^:：=]{1,40})[:：=]\s*(.*)$/);if(!m)return null;kv.push([m[1].trim(),m[2].trim()])}return kv}
function costCNY(e){if(e.cost==null)return null;if(e.currency==='¥')return e.cost;if(e.currency==='$'||!e.currency)return e.cost*(Number(S.rate)||7.2);return null}

/* 可折叠文本（提示词等） */
const expanded=new Set();
function clampBox(key,text,lines=2,cls=''){return `<div class="clampbox ${expanded.has(key)?'open':''}" style="--lines:${lines}"><div class="clamp ${cls}" title="${expanded.has(key)?'':'点击展开全文'}">${esc(text)}</div><button type="button" class="toggle" data-toggle="${esc(key)}"><span class="t-open">展开全文 ▾</span><span class="t-close">收起 ▴</span></button></div>`}
function fixClamps(root=document){requestAnimationFrame(()=>$$('.clampbox',root).forEach(b=>{if(b.classList.contains('open'))return;const c=$('.clamp',b);b.classList.toggle('short',c.scrollHeight<=c.clientHeight+2)}))}
document.addEventListener('click',ev=>{let t=ev.target.closest('[data-toggle]');
 if(!t){const c=ev.target.closest('.clampbox:not(.open):not(.short) .clamp');if(c)t=$('[data-toggle]',c.parentNode)}
 if(!t)return;ev.stopPropagation();const k=t.dataset.toggle;const b=t.closest('.clampbox');
 if(expanded.has(k))expanded.delete(k);else expanded.add(k);b.classList.toggle('open',expanded.has(k));$('.clamp',b).title=expanded.has(k)?'':'点击展开全文';if(!expanded.has(k))fixClamps(b.parentNode)},true);

/* 本组最优值 */
function computeBest(es){
 const r={cheap:new Set(),fast:new Set(),res:new Set(),score:new Set()};
 const pick=(arr,fn,dir,set)=>{const v=arr.map(e=>[e,fn(e)]).filter(x=>x[1]!=null&&!isNaN(x[1]));if(v.length<2)return;const b=dir<0?Math.min(...v.map(x=>x[1])):Math.max(...v.map(x=>x[1]));if(v.every(x=>x[1]===b))return;v.filter(x=>x[1]===b).forEach(x=>set.add(x[0].id))};
 let costFn=costCNY;
 if(!es.some(e=>costCNY(e)!=null)){const cs=new Set(es.filter(e=>e.cost!=null).map(e=>e.currency));if(cs.size===1)costFn=e=>e.cost}
 pick(es,costFn,-1,r.cheap);pick(es,e=>e.time,-1,r.fast);pick(es,e=>e.width&&e.height?e.width*e.height:null,1,r.res);pick(es,e=>e.score||null,1,r.score);
 return r}
function sortEntries(es){const k=S.sort;const a=[...es];const nl=(x,y,f)=>{const A=f(x),B=f(y);if(A==null&&B==null)return 0;if(A==null)return 1;if(B==null)return -1;return A-B};
 const fns={order:(x,y)=>(x.order||0)-(y.order||0),model:(x,y)=>String(x.model).localeCompare(String(y.model),'zh-Hans'),
  cost:(x,y)=>nl(x,y,e=>costCNY(e)??e.cost),time:(x,y)=>nl(x,y,e=>e.time),score:(x,y)=>(y.score||0)-(x.score||0),res:(x,y)=>((y.width||0)*(y.height||0))-((x.width||0)*(x.height||0)),best:(x,y)=>(y.best?1:0)-(x.best?1:0)};
 return a.sort((x,y)=>(fns[k]||fns.order)(x,y)||(x.order||0)-(y.order||0))}
const SORTS=[['order','添加顺序'],['model','模型名称'],['cost','成本 低→高'],['time','速度 快→慢'],['score','评分 高→低'],['res','分辨率 高→低'],['best','最佳优先']];

 const q=S.q.trim().toLowerCase();
 const list=sortedSets().filter(s=>{if(!q)return true;const hay=[s.title,s.prompt,s.negative,s.notes,(s.tags||[]).join(' '),...entriesOf(s.id).map(e=>e.model+' '+(e.provider||''))].join(' ').toLowerCase();return hay.includes(q)});
 $('#setList').innerHTML=list.length?list.map(s=>{const n=entriesOf(s.id).length;return `<div class="set-item ${s.id===S.cur?'active':''}" data-set="${s.id}">
  <div class="t">${s.sample?'<span class="badge warn">示例数据</span> ':''}${esc(s.title||'未命名对比组')}</div>
  <div class="p">${esc(s.prompt||'（无提示词）')}</div>
  <div class="s"><span>📅 ${esc(s.date||'')}</span><span>🖼 ${n} 张</span>${(s.tags||[]).filter(t=>t!=='示例数据').slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div>`}).join('')

 if(best.score.size)sum.push(`<span class="sum-item"><span class="ic">⭐</span>最高分 <b>${names(best.score)}</b></span>`);
 m.innerHTML=`<section class="set-head">

  <div class="prompt-box"><div class="pb-row"><div class="lbl">提示词<button class="link" data-act="copyPrompt" style="padding:0;text-align:left">复制</button></div>${clampBox(s.id+':prompt',s.prompt||'（未填写）',2,'prompt')}</div>
   ${s.negative?`<div class="pb-row"><div class="lbl">反向提示词</div>${clampBox(s.id+':neg',s.negative,1,'prompt neg')}</div>`:''}
   ${s.notes?`<div class="pb-row"><div class="lbl">备注</div>${clampBox(s.id+':notes',s.notes,1,'prompt neg')}</div>`:''}</div>
  ${sum.length?`<div class="summary">${sum.join('')}</div>`:''}
 </section>
 <div class="toolbar">
  <div class="seg"><button data-view="grid" class="${S.view==='grid'?'on':''}">▦ 网格</button><button data-view="table" class="${S.view==='table'?'on':''}">☰ 表格</button></div>
  <label>排序 <select id="sortSel">${SORTS.map(([k,v])=>`<option value="${k}" ${S.sort===k?'selected':''}>${v}</option>`).join('')}</select></label>
  ${S.view==='grid'?`<label>大小 <input type="range" id="thumbRange" min="140" max="560" step="10" value="${S.thumb}"></label>`:''}
  <label title="比较成本时把美元换算成人民币">汇率 $1 = ¥<input type="number" id="rateInput" step="0.01" min="0" value="${S.rate}"></label>
  <div class="spacer"></div>
  <button class="btn" data-act="compare" title="在图片左上角勾选 2–4 张后并排对比" ${n>=2&&n<=4?'':'disabled'}>⇆ 对比所选 (${n})</button>
  ${n?'<button class="btn sm" data-act="clearPick">清除勾选</button>':''}
  <button class="btn primary" data-act="addImages">＋ 添加图片</button>
 </div>
 <div id="content">${S.view==='grid'?gridHTML(es,best):tableHTML(es,best)}</div>`;
 fixClamps(m);
}
function gridHTML(es,best){
 return `<div class="grid ${S.picked.size?'has-picks':''}">${es.map(e=>`<div class="card ${e.best?'is-best':''} ${S.picked.has(e.id)?'picked':''}" data-id="${e.id}">
  <label class="pick" title="勾选用于并排对比"><input type="checkbox" data-pick="${e.id}" ${S.picked.has(e.id)?'checked':''}>对比</label>
  ${e.best?'<span class="best-badge">🏆 最佳</span>':''}
  <div class="thumb" data-open="${e.id}"><img src="${urlOf(e)}" alt="${esc(e.model)}" loading="lazy" draggable="false"></div>
  <div class="cap"><div class="cap-row"><span class="model" title="${esc(e.model)}">${esc(e.model||'未命名模型')}</span>${stars(e.score)}</div>
   <div class="prov">${esc(e.provider||'　')}</div>
   <div class="chips"><span class="chip ${best.cheap.has(e.id)?'hl':''}" title="成本/张">💰 ${fmtCost(e)}</span><span class="chip ${best.fast.has(e.id)?'hl':''}" title="生成耗时">⚡ ${fmtTime(e.time)}</span><span class="chip ${best.res.has(e.id)?'hl':''}" title="分辨率">🔍 ${fmtRes(e)}</span><span class="chip" title="画面比例">${aspect(e)}</span></div>
  </div><button class="btn sm edit" data-edit="${e.id}">✎ 编辑</button></div>`).join('')}
  <div class="add-card" data-act="addImages"><div class="plus">＋</div><div>拖入图片 或 点击添加</div><div class="hint">支持一次多张；文件名会预填为模型名</div></div></div>`}
function tableHTML(es,best){
 if(!es.length)return `<div class="add-card" data-act="addImages"><div class="plus">＋</div><div>这一组还没有图片，拖入或点击添加</div></div>`;
 const th=(k,label)=>`<th data-sort="${k}" class="${S.sort===k?'sorted':''}" title="点击按此排序">${label}${S.sort===k?' ▾':''}</th>`;
 return `<div class="tbl-wrap"><table><thead><tr><th>图</th>${th('model','模型')}<th>平台</th>${th('cost','成本/张')}${th('time','耗时')}${th('res','分辨率')}<th>比例</th>${th('score','评分 /10')}${th('best','最佳')}<th>默认设置 / 参数</th><th>优缺点 / 备注</th></tr></thead><tbody>
 ${es.map(e=>`<tr data-open="${e.id}" class="${e.best?'best-row':''}"><td><img class="mini" src="${urlOf(e)}" alt="" draggable="false"></td><td><span class="tbl-model">${esc(e.model||'未命名模型')}</span></td><td>${esc(e.provider||'—')}</td>
 <td class="num ${best.cheap.has(e.id)?'hl':''}">${fmtCost(e)}</td>
 <td class="num ${best.fast.has(e.id)?'hl':''}">${fmtTime(e.time)}</td><td class="num ${best.res.has(e.id)?'hl':''}">${fmtRes(e)}<div class="hint">${mp(e)}</div></td><td class="num">${aspect(e)}</td>
 <td class="${best.score.has(e.id)?'hl':''}">${stars(e.score)}</td><td>${e.best?'🏆':''}</td>
 <td class="params">${esc(e.params||'—')}</td><td class="notes">${e.pros?`<div>👍 ${esc(e.pros)}</div>`:''}${e.cons?`<div>👎 ${esc(e.cons)}</div>`:''}${e.notes?`<div>📝 ${esc(e.notes)}</div>`:''}${!e.pros&&!e.cons&&!e.notes?'—':''}</td></tr>`).join('')}
 </tbody></table></div><p class="hint">绿色高亮 = 本组最优（最便宜 / 最快 / 分辨率最高 / 评分最高）；美元成本按上方汇率折算为人民币（≈ ¥）后比较，「积分 / 其他」不参与比较。点击任意行查看大图，点击带 ▾ 的表头可排序。</p>`}

/* ========== 模态框 ========== */
const modalStack=[];
function showModal({title,body,footer='',wide=false,onClose}){
 const ov=document.createElement('div');ov.className='overlay modal-wrap';
 ov.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog"><header><h2>${title}</h2><div class="spacer"></div><button class="icon-btn" data-close title="关闭 (Esc)">✕</button></header><div class="body">${body}</div>${footer?`<footer>${footer}</footer>`:''}</div>`;
 const api={el:ov,kind:'modal',close(){ov.remove();const i=modalStack.indexOf(api);if(i>=0)modalStack.splice(i,1);onClose&&onClose()}};
 ov.addEventListener('mousedown',e=>{ov._down=e.target===ov});
 ov.addEventListener('click',e=>{if(e.target===ov&&ov._down)api.close();else if(e.target.closest('[data-close]'))api.close();ov._down=false});
 document.body.appendChild(ov);modalStack.push(api);return api}
document.addEventListener('keydown',e=>{const top=modalStack[modalStack.length-1];if(!top)return;
 if(e.key==='Escape'){e.preventDefault();top.close();return}
 if(top.onKey)top.onKey(e)});

/* ========== 对比组 表单 ========== */
function openSetForm(s){
 const isNew=!s;s=s||{title:'',prompt:'',negative:'',date:today(),tags:[],notes:''};
 const m=showModal({title:isNew?'新建对比组':'编辑对比组',body:`<form class="form" id="setForm">
  <label>标题 <small>留空则自动用提示词开头</small><input name="title" value="${esc(s.title)}" placeholder="例如：雨夜霓虹橘猫 · 写实"></label>
  <label>提示词 *<textarea name="prompt" rows="5" placeholder="粘贴你给所有模型使用的同一段提示词">${esc(s.prompt)}</textarea></label>
  <label>反向提示词 <small>可选</small><textarea name="negative" rows="2">${esc(s.negative)}</textarea></label>
  <div class="g2"><label>日期<input type="date" name="date" value="${esc(s.date)}"></label><label>标签 <small>用逗号或空格分隔</small><input name="tags" value="${esc((s.tags||[]).join(', '))}" placeholder="人像, 写实, 中文文字"></label></div>
  <label>备注<textarea name="notes" rows="3">${esc(s.notes)}</textarea></label></form>`,
  footer:`<button class="btn" data-close>取消</button><button class="btn primary" id="setSave">${isNew?'创建，然后添加图片':'保存'}</button>`});
 const f=$('#setForm',m.el);setTimeout(()=>f.prompt.focus(),30);
 const save=async()=>{const d=Object.fromEntries(new FormData(f));if(!d.prompt.trim()&&!d.title.trim()){toast('请至少填写提示词或标题');return}
  const p=d.prompt.trim();
  const obj={...s,id:s.id||uid(),title:d.title.trim()||p.slice(0,24)+(p.length>24?'…':''),prompt:p,negative:d.negative.trim(),date:d.date||today(),tags:d.tags.split(/[,，、\s]+/).map(x=>x.trim()).filter(Boolean),notes:d.notes.trim(),createdAt:s.createdAt||Date.now()};
  await idb.put('sets',obj);const i=S.sets.findIndex(x=>x.id===obj.id);if(i>=0)S.sets[i]=obj;else S.sets.push(obj);
  m.close();selectSet(obj.id);toast(isNew?'已创建，拖入或选择图片吧':'已保存');if(isNew)$('#addFiles').click()};
 $('#setSave',m.el).onclick=save;
 f.addEventListener('submit',e=>{e.preventDefault();save()});
}
async function deleteSet(id){const s=S.sets.find(x=>x.id===id);if(!s)return;const es=entriesOf(id);
 if(!confirm(`确定删除对比组「${s.title}」及其中 ${es.length} 张图片吗？此操作不可撤销（建议先导出备份）。`))return;
 for(const e of es){await idb.del('entries',e.id);dropUrl(e.id)}await idb.del('sets',id);
 S.entries=S.entries.filter(e=>e.setId!==id);S.sets=S.sets.filter(x=>x.id!==id);S.cur=sortedSets()[0]?.id||null;pref.set('cur',S.cur);S.picked.clear();renderAll();toast('已删除')}

/* ========== 添加图片 ========== */
function readDims(blob){return new Promise(res=>{const u=URL.createObjectURL(blob);const im=new Image();im.onload=()=>{res([im.naturalWidth,im.naturalHeight]);URL.revokeObjectURL(u)};im.onerror=()=>{res([null,null]);URL.revokeObjectURL(u)};im.src=u})}
function guessModel(fname){
 const base=fname.replace(/\.[a-z0-9]+$/i,'');
 const nb=normName(base);
 /* 模型库优先（可带出默认值），其次预设；按名称长度从长到短匹配，忽略大小写、空格、-、_、. */
 const cands=[...S.models.map(m=>m.name),...PRESET_MODELS].filter(n=>normName(n));
 const hit=cands.map((n,i)=>[n,i]).sort((a,b)=>normName(b[0]).length-normName(a[0]).length||a[1]-b[1]).find(([n])=>nb.includes(normName(n)));
 if(hit){const lib=modelByName(hit[0]);const pre=PRESET_MODELS.find(p=>normName(p)===normName(hit[0]));return lib?lib.name:pre||hit[0]}
 return base.replace(/[_\-\s]+(\d{1,4}|copy|副本|final|out|output)$/i,'').replace(/_/g,' ').trim()||base}
async function addFiles(files){
 files=[...files].filter(f=>(f.type||'').startsWith('image/')||/\.(png|jpe?g|webp|gif|avif|bmp)$/i.test(f.name));
 if(!files.length){toast('没有识别到图片文件');return}
 let s=cur();
 if(!s){s={id:uid(),title:'未命名对比组 '+today(),prompt:'',negative:'',date:today(),tags:[],notes:'',createdAt:Date.now()};await idb.put('sets',s);S.sets.push(s);S.cur=s.id;pref.set('cur',s.id)}
 let order=Math.max(0,...entriesOf(s.id).map(e=>e.order||0));const ids=[];
 for(const f of files){const [w,h]=await readDims(f);const model=guessModel(f.name);const lib=modelByName(model);
  const e={id:uid(),setId:s.id,order:++order,model,provider:lib?.provider||'',blob:f,mime:f.type,fileName:f.name,width:w,height:h,aspect:'',cost:lib?.cost??null,currency:lib?.currency||'$',time:null,params:lib?.params||'',score:0,pros:'',cons:'',notes:'',best:false,createdAt:Date.now()};
  await idb.put('entries',e);S.entries.push(e);ids.push(e.id)}
 renderAll();toast(`已添加 ${ids.length} 张图片，接下来逐张填写信息`);
 openEntryForm(ids);
}

function attachModelCombo(input,host,{withLib=true}={}){

  dd.style.left=r.left+'px';dd.style.width=Math.max(r.width,290)+'px';
  if(below<h+12&&r.top>below){dd.style.top='';dd.style.bottom=(innerHeight-r.top+6)+'px'}else{dd.style.bottom='';dd.style.top=(r.bottom+6)+'px'}};
 const hl=(name,q)=>{if(!q)return esc(name);const lo=name.toLowerCase();let out='',i=0;const toks=q.toLowerCase().split(/\s+/).filter(Boolean);
  const marks=new Array(name.length).fill(false);toks.forEach(t=>{const j=lo.indexOf(t);if(j>=0)for(let k=j;k<j+t.length;k++)marks[k]=true});
  for(i=0;i<name.length;i++)out+=marks[i]&&!marks[i-1]?'<mark>'+esc(name[i]):esc(name[i]),out+=marks[i]&&!marks[i+1]?'</mark>':'';return out};
 const render=()=>{const q=filtering?input.value.trim():'';const toks=q.split(/\s+/).map(normName).filter(Boolean);
  items=modelOptions(withLib).filter(o=>toks.every(t=>normName(o.name).includes(t)));

  if(active>=items.length)active=items.length-1;
  const cur=normName(input.value);
  dd.innerHTML=(items.length?items.map((o,i)=>`<div class="combo-opt ${i===active?'active':''} ${normName(o.name)===cur?'sel':''}" role="option" id="${lid}-${i}" aria-selected="${i===active}" data-i="${i}"><span class="co-name">${hl(o.name,q)}</span><span class="co-tag ${o.kind}">${esc(o.sub)}</span></div>`).join('')
   :'')+(q&&!exact&&active<0?`<div class="combo-custom">↵ 使用自定义名称「<b>${esc(q)}</b>」</div>`:'')+(!items.length&&!q?'<div class="combo-custom">暂无选项，可直接输入</div>':'')+`<div class="combo-foot">↑↓ 选择 · Enter 确认 · Esc 关闭 · 可直接输入任意名称</div>`;

 input.addEventListener('focus',()=>{if(input.dataset.skipOpen){delete input.dataset.skipOpen;return}open(false)});

 input.addEventListener('input',e=>{if(!e.isTrusted&&dd.hidden)return;active=-1;open(true)});
 input.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(dd.hidden){open(false);return}const n=items.length;if(!n)return;active=e.key==='ArrowDown'?(active+1)%n:(active-1+n)%n;render()}
  else if(e.key==='Enter'){if(!dd.hidden){e.preventDefault();e.stopPropagation();if(active>=0&&items[active])pick(active);else close()}}
  else if(e.key==='Escape'){if(!dd.hidden){e.preventDefault();e.stopPropagation();close()}}
  else if(e.key==='Tab')close()});
 input.addEventListener('blur',()=>setTimeout(()=>{if(document.activeElement!==input)close()},120));
 dd.addEventListener('mousedown',e=>{e.preventDefault();const o=e.target.closest('.combo-opt');if(o)pick(Number(o.dataset.i));else if(e.target.closest('.combo-custom'))close()});

/* ========== 缩放/平移组件 ========== */
class Zoomer{
 constructor(stage,img,onChange){this.stage=stage;this.img=img;this.s=1;this.x=0;this.y=0;this.onChange=onChange;
  stage.addEventListener('wheel',e=>{e.preventDefault();this.zoomAt(this.s*Math.exp(-e.deltaY*0.0015),e)},{passive:false});
  stage.addEventListener('pointerdown',e=>{if(e.button!==0)return;this.drag={px:e.clientX,py:e.clientY,x:this.x,y:this.y};stage.setPointerCapture(e.pointerId);stage.classList.add('dragging')});
  stage.addEventListener('pointermove',e=>{if(!this.drag)return;this.x=this.drag.x+e.clientX-this.drag.px;this.y=this.drag.y+e.clientY-this.drag.py;this.apply(true)});
  const up=()=>{this.drag=null;stage.classList.remove('dragging')};stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
  stage.addEventListener('dblclick',e=>{if(this.s>1.01)this.reset();else this.zoomAt(2.5,e)})}
 zoomAt(ns,e){ns=Math.min(40,Math.max(0.2,ns));const r=this.stage.getBoundingClientRect();
  const px=e?e.clientX-r.left-r.width/2:0,py=e?e.clientY-r.top-r.height/2:0;
  this.x=px-(px-this.x)*(ns/this.s);this.y=py-(py-this.y)*(ns/this.s);this.s=ns;this.apply(true)}
 actual(){const w=this.img.offsetWidth;if(w&&this.img.naturalWidth){this.s=1;this.x=0;this.y=0;this.zoomAt(this.img.naturalWidth/w)}}
 reset(){this.s=1;this.x=0;this.y=0;this.apply(true)}
 set(st){this.s=st.s;this.x=st.x;this.y=st.y;this.apply(false)}
 apply(emit){this.img.style.transform=`translate(${this.x}px,${this.y}px) scale(${this.s})`;if(emit&&this.onChange)this.onChange(this)}
 pct(){const w=this.img.offsetWidth;return w&&this.img.naturalWidth?Math.round(this.s*w/this.img.naturalWidth*100):Math.round(this.s*100)}
}

/* ========== 导出 / 导入 ========== */
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
function dataURLToBlob(u){const i=u.indexOf(',');const h=u.slice(0,i),d=u.slice(i+1);const mime=(h.match(/data:([^;,]+)/)||[])[1]||'image/png';const bin=atob(d);const a=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);return new Blob([a],{type:mime})}
async function exportAll(){
 if(!S.sets.length){toast('还没有数据可导出');return}toast('正在打包导出…');
 const entries=[];for(const e of S.entries){const {blob,...rest}=e;entries.push({...rest,image:blob?await blobToDataURL(blob):null})}
 const data={app:'image-model-compare',version:SCHEMA,exportedAt:new Date().toISOString(),sets:S.sets,entries,models:S.models};
 const b=new Blob([JSON.stringify(data)],{type:'application/json'});const d=new Date();const p=n=>String(n).padStart(2,'0');
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`图像模型对比_备份_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),10000);toast(`已导出 ${S.sets.length} 组 / ${S.entries.length} 张图（${(b.size/1048576).toFixed(1)} MB）`)}
$('#importFile').addEventListener('change',async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;
 let data;try{data=JSON.parse(await f.text())}catch(e){alert('文件不是有效的 JSON：'+e.message);return}
 if(data.app!=='image-model-compare'||!Array.isArray(data.sets)){alert('这不是本工具导出的备份文件。');return}
 if(!confirm(`将导入 ${data.sets.length} 组、${(data.entries||[]).length} 张图、${(data.models||[]).length} 个模型。\n已存在的相同记录会被覆盖，其他数据保留（合并导入）。继续？`))return;
 try{for(const s of data.sets)await idb.put('sets',s);
  const ver=Number(data.version)||1;
  for(const e of data.entries||[]){const {image,...rest}=e;const obj=migrateEntry({...rest,blob:image?dataURLToBlob(image):null},ver);dropUrl(obj.id);await idb.put('entries',obj)}
  for(const m of data.models||[])await idb.put('models',migrateModel(m));
  await idb.put('meta',{key:'seeded',value:true});
  [S.sets,S.entries,S.models]=await Promise.all([idb.all('sets'),idb.all('entries'),idb.all('models')]);
  if(data.sets[0])S.cur=data.sets[0].id;pref.set('cur',S.cur);S.picked.clear();renderAll();toast(`导入完成：${data.sets.length} 组 / ${(data.entries||[]).length} 张图`)}
 catch(e){console.warn(e);alert('导入失败：'+e.message)}});

/* ========== 数据版本 / 迁移 ==========
 v1：评分 1–5，含 seed/steps；v2：评分 1–10，去掉 seed/steps */
const SCHEMA=2;
function migrateEntry(e,from){if(from<2&&e.score)e.score=Math.min(10,Math.round(e.score*2));delete e.seed;delete e.steps;return e}
function migrateModel(m){delete m.steps;delete m.seed;return m}
async function migrateDB(){const sv=(await idb.get('meta','schema'))?.value||1;if(sv>=SCHEMA)return;
 for(const e of S.entries){migrateEntry(e,sv);await idb.put('entries',e)}
 for(const m of S.models){migrateModel(m);await idb.put('models',m)}
 await idb.put('meta',{key:'schema',value:SCHEMA});if(S.entries.length)console.info('数据已升级到 v'+SCHEMA)}

function rng(seed){return()=>(seed=(seed*16807)%2147483647)/2147483647}
function placeholder(w,h,hA,hB,label,seed){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');const r=rng(seed);
 const gr=g.createLinearGradient(0,0,w,h);gr.addColorStop(0,`hsl(${hA} 75% 52%)`);gr.addColorStop(1,`hsl(${hB} 70% 18%)`);g.fillStyle=gr;g.fillRect(0,0,w,h);
 for(let i=0;i<22;i++){const x=r()*w,y=r()*h,rad=(0.04+r()*0.22)*Math.min(w,h);const rg=g.createRadialGradient(x,y,0,x,y,rad);rg.addColorStop(0,`hsla(${Math.round(hA+r()*80)%360},90%,70%,${(0.25+r()*0.4).toFixed(2)})`);rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.beginPath();g.arc(x,y,rad,0,Math.PI*2);g.fill()}
 g.strokeStyle='rgba(255,255,255,.08)';g.lineWidth=1;for(let x=0;x<w;x+=64){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke()}for(let y=0;y<h;y+=64){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}
 const fs=Math.round(Math.min(w,h)/11);g.fillStyle='rgba(0,0,0,.4)';g.fillRect(0,h/2-fs*1.3,w,fs*2.6);g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';
 g.font=`bold ${fs}px sans-serif`;g.fillText(label,w/2,h/2-fs*0.3);g.font=`${Math.round(fs*0.42)}px sans-serif`;g.fillText(`示例占位图 · ${w}×${h}`,w/2,h/2+fs*0.75);
 return new Promise(res=>c.toBlob(res,'image/jpeg',0.85))}

(async function init(){
 try{db=await openDB()}catch(e){$('#main').innerHTML=`<div class="empty"><div class="big">⚠️</div><h2>无法打开本地数据库</h2><p>浏览器禁用了 IndexedDB（可能是无痕模式或隐私设置）。请用普通窗口的 Chrome / Edge / Firefox 打开。</p><p class="hint">${esc(e&&e.message)}</p></div>`;return}
 [S.sets,S.entries,S.models]=await Promise.all([idb.all('sets'),idb.all('entries'),idb.all('models')]);
 if(!(await idb.get('meta','seeded'))){await seedSample();await idb.put('meta',{key:'seeded',value:true});await idb.put('meta',{key:'schema',value:SCHEMA})}
 else await migrateDB();
 if(!S.sets.find(s=>s.id===S.cur))S.cur=sortedSets()[0]?.id||null;
 renderAll();
 if(!pref.get('welcomed',false))openHelp(true);
 window.__ready=true;
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
})();

</script>
</body>
