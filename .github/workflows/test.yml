name: 测试 / Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: 检查 index.html 与 src/ 同步
        run: python3 src/build.py --check

      - name: 端到端测试（headless Chromium，file://）
        env:
          SHOT_DIR: ${{ runner.temp }}/screenshots
        run: python3 tests/test_app.py

      - name: 上传测试截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
